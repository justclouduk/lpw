<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Paper Wins</title>
  <meta name="description" content="Bespoke greeting cards for every occasion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fdf6ec;
      --ink: #2b2140;
      --muted: #6b5f7a;
      --coral: #ff6b6b;
      --sun: #ffc93c;
      --mint: #4ecdc4;
      --lilac: #a78bfa;
      --card: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating paper confetti */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .confetti span {
      position: absolute;
      display: block;
      border-radius: 4px;
      opacity: 0.85;
      animation: float 9s ease-in-out infinite;
    }
    .confetti span:nth-child(1)  { top: 8%;  left: 10%; width: 22px; height: 30px; background: var(--coral); transform: rotate(-18deg); }
    .confetti span:nth-child(2)  { top: 18%; left: 82%; width: 28px; height: 20px; background: var(--sun);   transform: rotate(24deg); animation-delay: -2s; }
    .confetti span:nth-child(3)  { top: 72%; left: 6%;  width: 18px; height: 18px; background: var(--mint);  border-radius: 50%; animation-delay: -4s; }
    .confetti span:nth-child(4)  { top: 80%; left: 88%; width: 26px; height: 34px; background: var(--lilac); transform: rotate(12deg); animation-delay: -1s; }
    .confetti span:nth-child(5)  { top: 45%; left: 92%; width: 14px; height: 14px; background: var(--coral); border-radius: 50%; animation-delay: -6s; }
    .confetti span:nth-child(6)  { top: 50%; left: 3%;  width: 20px; height: 26px; background: var(--sun);   transform: rotate(-30deg); animation-delay: -3s; }
    .confetti span:nth-child(7)  { top: 4%;  left: 52%; width: 16px; height: 16px; background: var(--lilac); border-radius: 50%; animation-delay: -5s; }
    .confetti span:nth-child(8)  { top: 90%; left: 45%; width: 24px; height: 16px; background: var(--mint);  transform: rotate(40deg); animation-delay: -7s; }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti span { animation: none; }
    }

    /* The "greeting card" */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 20px;
      padding: 56px 32px 48px;
      text-align: center;
      box-shadow:
        0 1px 0 rgba(43, 33, 64, 0.04),
        0 24px 48px -16px rgba(43, 33, 64, 0.18);
      transform: rotate(-1.2deg);
    }
    .card::before {
      /* colourful ribbon across the top */
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, var(--coral), var(--sun), var(--mint), var(--lilac));
    }

    .mark {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    h1 .wins {
      background: linear-gradient(90deg, var(--coral), var(--lilac));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 16px;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 600;
      color: var(--ink);
    }

    .soon {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--sun);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="confetti" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="card">
    <!-- simple envelope mark -->
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="6" y="16" width="52" height="36" rx="5" fill="#ffc93c"/>
      <path d="M6 21 L32 38 L58 21" fill="none" stroke="#2b2140" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="16" r="9" fill="#ff6b6b"/>
      <path d="M44.5 16 l2.5 2.5 l4.5 -5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>Little Paper <span class="wins">Wins</span></h1>
    <p class="tagline">Bespoke greeting cards for every occasion</p>
    <span class="soon">Coming soon</span>

    <footer>&copy; 2026 Little Paper Wins</footer>
  </main>
</body>
</html>
