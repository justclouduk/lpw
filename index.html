<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming soon</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1f; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --fg: #f5f5f7; --muted: #8e8e93; }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Coming soon</h1>
    <p>Something new is on the way.</p>
  </main>
</body>
</html>
